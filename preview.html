<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Preview STG</title>
    <link rel="stylesheet" href="./deployments.css" />
  </head>
  <body>
    <p>Review saved changes before publishing.</p>
    <nav class="actions">
      <a class="button" href="https://stg.acidfairies.cc.cd" target="_blank" rel="noopener noreferrer">Open STG</a>
    </nav>
    <section data-workflow="deploy-stg.yml">
      <h2>Deployment history</h2>
      <p>Auto-refreshes every 30s (10s during deployment).</p>
      <p>If a deployment gets stuck, open its run in GitHub Actions and investigate it manually.</p>
      <p role="status">Loading deployment history…</p>
      <table>
        <thead>
          <tr>
            <th scope="col">Run</th>
            <th scope="col">Status</th>
            <th scope="col">Started</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <nav class="actions">
        <button type="button" data-refresh>Refresh</button>
        <a class="button" id="actions" target="_blank" rel="noopener noreferrer">GitHub Actions</a>
      </nav>
    </section>
    <script type="module" src="./deployments.js"></script>
  </body>
</html>
