<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Publish to Production</title>
    <style>
      body {
        font:
          16px system-ui,
          sans-serif;
        padding: 2rem;
      }
      button {
        font: inherit;
        padding: 0.65rem 1rem;
        cursor: pointer;
      }
      button:disabled {
        cursor: wait;
      }
      #files {
        font-family: ui-monospace, monospace;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <p>
      Publish all saved changes to the production website.
      <a href="https://stg.acidfairies.cc.cd" target="_blank" rel="noopener noreferrer">Preview STG</a>
    </p>
    <p id="changes" role="status">Checking for unpublished changes…</p>
    <ul id="files" hidden></ul>
    <button type="button" id="publish">Publish Changes</button>
    <p id="status" role="status" hidden></p>
    <p><a id="actions" target="_blank" rel="noopener noreferrer" hidden>View deployment workflow</a></p>
    <script type="module" src="./publish.js"></script>
  </body>
</html>
