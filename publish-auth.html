<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Publish to lab PROD</title>
  <style>
    body { font: 16px system-ui, sans-serif; padding: 2rem; max-width: 40rem; line-height: 1.5; }
    button { font: inherit; padding: .65rem 1rem; cursor: pointer; }
    button:disabled { cursor: wait; }
  </style>
</head>
<body>
  <h2>Publish to lab PROD</h2>
  <p>This experiment triggers <code>sveltia-cms-publish</code> in the source repository. The current workflow redeploys <code>src/main</code> to the <strong>lab</strong> PROD website; it does <strong>not</strong> yet merge <code>stg</code> into <code>main</code>.</p>
  <button type="button" id="publish">Trigger lab PROD deployment</button>
  <p role="status" id="status">No deployment requested.</p>
  <p><a id="actions" hidden target="_blank" rel="noopener noreferrer">View GitHub Actions</a></p>
  <script type="module">
    const worker = 'https://sveltia-cms-auth.adam-artajew.workers.dev'
    const repository = 'acid-fairies-lab/src'
    const publish = document.querySelector('#publish')
    const actions = document.querySelector('#actions')
    const status = document.querySelector('#status')

    function authorize() {
      return new Promise((resolve, reject) => {
        const origin = new URL(worker).origin
        const url = new URL('/auth', origin)
        url.searchParams.set('provider', 'github')
        url.searchParams.set('site_id', location.hostname)
        const popup = window.open(url, 'publish-github-authorization', 'width=540,height=700')
        if (!popup) return reject(new Error('Allow the GitHub authorization popup and retry.'))

        const finish = (error, token) => {
          window.removeEventListener('message', receive)
          clearTimeout(timeout)
          popup.close()
          if (error) reject(error)
          else resolve(token)
        }
        const timeout = setTimeout(() => finish(new Error('GitHub authorization timed out.')), 120_000)
        const receive = event => {
          if (event.origin !== origin || event.source !== popup) return
          if (event.data === 'authorizing:github') {
            popup.postMessage('authorizing:github', origin)
            return
          }
          const match = /^authorization:github:(success|error):(.+)$/.exec(event.data)
          if (!match) return
          try {
            const response = JSON.parse(match[2])
            if (match[1] !== 'success' || !response.token)
              throw new Error(response.error || 'GitHub authorization failed.')
            finish(null, response.token)
          } catch (error) {
            finish(error)
          }
        }
        window.addEventListener('message', receive)
      })
    }

    async function githubGet(path, token) {
      const response = await fetch('https://api.github.com' + path, {
        headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' },
      })
      if (!response.ok) throw new Error('GitHub API returned HTTP ' + response.status)
      return response.json()
    }

    publish.addEventListener('click', async () => {
      if (!confirm('Trigger a LAB PROD deployment from src/main? This does not merge staging changes.')) return

      publish.disabled = true
      actions.hidden = true
      status.textContent = 'Authorizing with GitHub…'

      try {
        const token = await authorize()
        const [user, repo] = await Promise.all([
          githubGet('/user', token),
          githubGet('/repos/' + repository, token),
        ])
        if (repo.full_name !== repository || repo.permissions?.push !== true)
          throw new Error('GitHub account ' + user.login + ' has no write access to ' + repository)

        status.textContent = 'Requesting deployment…'
        const response = await fetch('https://api.github.com/repos/' + repository + '/dispatches', {
          method: 'POST',
          headers: {
            Authorization: 'Bearer ' + token,
            Accept: 'application/vnd.github+json',
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ event_type: 'sveltia-cms-publish' }),
        })
        if (response.status !== 204)
          throw new Error('GitHub rejected the deployment request: HTTP ' + response.status)

        status.textContent = 'GitHub accepted the request from ' + user.login + '. Check the workflow for its result.'
        actions.href = 'https://github.com/' + repository + '/actions/workflows/prod.yml'
        actions.hidden = false
        actions.textContent = 'View deployment workflow'
      } catch (error) {
        status.textContent = error.message || 'Failed to request deployment.'
      } finally {
        publish.disabled = false
      }
    })
  </script>
</body>
</html>
